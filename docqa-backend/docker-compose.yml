version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: docqa-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 2110851921
      MYSQL_DATABASE: docqa
      # ngram 全文检索（中文双字分词）
      command: --ngram_token_size=2
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p2110851921"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docqa-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DOCQA_DB_HOST: mysql
      DOCQA_DB_PORT: 3306
      DOCQA_DB_NAME: docqa
      DOCQA_DB_USER: root
      DOCQA_DB_PASSWORD: 2110851921
      # 未配置 Key 时自动降级 Mock 模式（演示可跑通全链路）
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      LLM_MODEL: ${LLM_MODEL:-glm-4-flash}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embedding-3}
    ports:
      - "8080:8080"

  frontend:
    image: node:22-alpine
    container_name: docqa-frontend
    working_dir: /app
    volumes:
      - ../:/app
      - node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysqldata:
  node_modules:
